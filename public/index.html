<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthKeys Admin Panel</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-4 md:p-8">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Шапка -->
    <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl">
      <h1 class="text-2xl font-bold text-indigo-400 mb-4">🔑 AuthKeys Manager Pro</h1>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Master Key (Пароль Администратора)</label>
        <input type="password" id="masterKey" placeholder="Введите ваш MASTER_KEY из Vercel" 
               class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-indigo-500">
      </div>
    </div>

    <!-- Вкладки / Панели -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Создание Ключа -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-emerald-400">Создать новый ключ</h2>
        
        <div>
          <label class="block text-xs text-slate-400">Метка / Клиент</label>
          <input type="text" id="label" placeholder="user_alex" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mt-1">
        </div>

        <div>
          <label class="block text-xs text-slate-400">Заметка</label>
          <textarea id="note" placeholder="Оплата за месяц, VIP клиент..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mt-1 h-16"></textarea>
        </div>

        <!-- Длительность с выбором единиц -->
        <div>
          <label class="block text-xs text-slate-400">Срок действия (0 = бессрочно)</label>
          <div class="flex gap-2 mt-1">
            <input type="number" id="durationValue" placeholder="1" class="w-1/2 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm">
            <select id="durationUnit" class="w-1/2 bg-slate-900 border border-slate-700 rounded px-2 py-2 text-sm">
              <option value="seconds">Секунд</option>
              <option value="minutes">Минут</option>
              <option value="hours">Часов</option>
              <option value="days" selected>Дней</option>
              <option value="months">Месяцев (30дн)</option>
            </select>
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-400">Лимит использований (0 или пусто = безлимит)</label>
          <input type="number" id="maxUses" placeholder="10" class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mt-1">
        </div>

        <button onclick="generateKey()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-lg font-medium transition">
          Сгенерировать
        </button>

        <div id="genResult" class="hidden p-3 bg-slate-900 border border-emerald-500 rounded text-xs break-all">
          <div>Ключ создан:</div>
          <div id="newKeyText" class="font-mono text-emerald-400 font-bold select-all my-1"></div>
        </div>
      </div>

      <!-- Управление существующим ключом -->
      <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-xl space-y-4">
        <h2 class="text-lg font-bold text-amber-400">Управление ключом</h2>
        
        <div>
          <label class="block text-xs text-slate-400">API Key для управления</label>
          <input type="text" id="targetKey" placeholder="sk_live_..." class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-sm mt-1 font-mono">
        </div>

        <div class="flex gap-2">
          <button onclick="getKeyInfo()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-1.5 text-xs rounded">Инфо</button>
          <button onclick="setStatus('active')" class="flex-1 bg-green-700 hover:bg-green-600 py-1.5 text-xs rounded">Разблок.</button>
          <button onclick="deleteKey()" class="flex-1 bg-red-800 hover:bg-red-700 py-1.5 text-xs rounded">Удалить</button>
        </div>

        <div class="border-t border-slate-700 pt-3 space-y-2">
          <div class="text-xs text-slate-400">Блокировка:</div>
          <button onclick="setStatus('blocked_forever')" class="w-full bg-red-900/60 hover:bg-red-900 text-red-300 border border-red-700 py-1.5 text-xs rounded">
            ⛔ Заблокировать НАВСЕГДА
          </button>
          
          <div class="flex gap-2">
            <input type="number" id="blockMins" placeholder="Мин." class="w-20 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-xs">
            <button onclick="setStatus('blocked_temp')" class="flex-1 bg-amber-800/60 hover:bg-amber-800 text-amber-300 border border-amber-700 py-1 text-xs rounded">
              ⏳ Заблокировать на время
            </button>
          </div>
        </div>

        <!-- Показ Информации -->
        <div id="infoBox" class="hidden p-3 bg-slate-900 border border-slate-700 rounded text-xs space-y-1">
          <div><b>Метка:</b> <span id="infoLabel"></span></div>
          <div><b>Заметка:</b> <span id="infoNote"></span></div>
          <div><b>Статус:</b> <span id="infoStatus"></span></div>
          <div><b>Использовано:</b> <span id="infoUses"></span></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    function getMasterKey() {
      const key = document.getElementById('masterKey').value;
      if (!key) alert('Введите Master Key!');
      return key;
    }

    async function generateKey() {
      const masterKey = getMasterKey();
      if (!masterKey) return;

      const res = await fetch('/api/keys?action=generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          masterKey,
          label: document.getElementById('label').value,
          note: document.getElementById('note').value,
          durationValue: document.getElementById('durationValue').value,
          durationUnit: document.getElementById('durationUnit').value,
          maxUses: document.getElementById('maxUses').value
        })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('genResult').classList.remove('hidden');
        document.getElementById('newKeyText').textContent = data.apiKey;
      } else {
        alert('Ошибка: ' + (data.error || 'Неизвестно'));
      }
    }

    async function getKeyInfo() {
      const masterKey = getMasterKey();
      const apiKey = document.getElementById('targetKey').value;
      if (!masterKey || !apiKey) return;

      const res = await fetch('/api/keys?action=info', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ masterKey, apiKey })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('infoBox').classList.remove('hidden');
        document.getElementById('infoLabel').textContent = data.data.label;
        document.getElementById('infoNote').textContent = data.data.note || '-';
        document.getElementById('infoStatus').textContent = data.data.status;
        document.getElementById('infoUses').textContent = `${data.data.usesCount} / ${data.data.maxUses || '∞'}`;
      } else {
        alert(data.error);
      }
    }

    async function setStatus(status) {
      const masterKey = getMasterKey();
      const apiKey = document.getElementById('targetKey').value;
      if (!masterKey || !apiKey) return;

      const res = await fetch('/api/keys?action=status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          masterKey,
          apiKey,
          status,
          blockMinutes: document.getElementById('blockMins').value
        })
      });
      const data = await res.json();
      if (data.success) alert('Статус обновлен!');
      else alert(data.error);
    }

    async function deleteKey() {
      const masterKey = getMasterKey();
      const apiKey = document.getElementById('targetKey').value;
      if (!masterKey || !apiKey) return;

      if (!confirm('Удалить этот ключ навсегда?')) return;

      const res = await fetch('/api/keys?action=delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ masterKey, apiKey })
      });
      const data = await res.json();
      if (data.success) alert('Ключ удален!');
      else alert(data.error);
    }
  </script>
</body>
</html>
